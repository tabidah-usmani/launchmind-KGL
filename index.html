<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuSprint</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2f4f7f;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #1a2940;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        .headline {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .subheadline {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .features {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .features li {
            margin-bottom: 10px;
        }
        .features li::before {
            content: "\2022";
            color: #34c759;
            font-weight: bold;
            margin-right: 10px;
        }
        .call-to-action {
            background-color: #34c759;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
        }
        .call-to-action:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="headline">DocuSprint: Accelerate Your Documentation</h1>
        <p class="subheadline">DocuSprint is a tool that helps you generate high-quality documentation quickly and efficiently.</p>
        <ul class="features">
            <li>Automated document generation</li>
            <li>Customizable templates</li>
            <li>Real-time collaboration</li>
            <li>Version control</li>
            <li>Secure storage</li>
        </ul>
        <button class="call-to-action">Generate My Docs Free</button>
    </div>
</body>
</html>
